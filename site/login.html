<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#101e31">
<title>Acceso privado | Gastos invisibles</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/login.css">
<script src="/login.js" defer></script>
</head>
<body>
<main class="login-shell">
  <div class="brand"><img src="/icon.svg" alt="" width="44" height="44"><span>Gastos <strong>invisibles</strong></span></div>
  <div class="panel">
    <span class="eyebrow">BETA PRIVADA</span>
    <h1>Bienvenido</h1>
    <p>Accede con el correo y la contrase&ntilde;a exclusiva de prueba que se configuraron en Netlify.</p>
    <form id="login-form" novalidate>
      <label for="email">Correo electr&oacute;nico</label>
      <input id="email" type="email" autocomplete="username" name="email" required maxlength="254" placeholder="correo@ejemplo.com">
      <label for="password">Contrase&ntilde;a</label>
      <input id="password" type="password" autocomplete="current-password" name="password" required minlength="14">
      <button id="submit" type="submit">Iniciar sesi&oacute;n</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </div>
  <p class="footnote">Esta es una versi&oacute;n de pruebas. No conectamos bancos ni guardamos tus estados de cuenta en servidores.</p>
</main>
</body>
</html>
