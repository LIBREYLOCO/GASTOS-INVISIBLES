[build]
  command = "npm ci --ignore-scripts && npm run build"
  publish = "site"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
[[headers]]
  for = "/login.html"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/login.js"
  [headers.values]
    Cache-Control = "no-store"
[[edge_functions]]
  function = "guard"
  path = "/*"

[build.environment]
  NODE_VERSION = "24"
